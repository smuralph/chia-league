<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chia League Data Pipeline</title>
  <desc id="desc">Flow from Yahoo fantasy data through scraping, normalization, GitHub, Postgres, and Vercel deployment.</desc>
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 16px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 18; }
      .stage { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 16; }
      .label { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #0f172a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .pill { fill: #e2e8f0; stroke: #475569; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#f8fafc"/>

  <text x="600" y="52" text-anchor="middle" class="title">Chia League Data Pipeline</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">Historical archive + live-season fallback</text>

  <rect x="80" y="140" width="180" height="110" class="box"/>
  <text x="170" y="190" text-anchor="middle" class="label">Yahoo Fantasy</text>
  <text x="170" y="214" text-anchor="middle" class="small">League / roster / matchup data</text>

  <rect x="330" y="140" width="180" height="110" class="box"/>
  <text x="420" y="186" text-anchor="middle" class="label">Scrapers</text>
  <text x="420" y="210" text-anchor="middle" class="small">Raw HTML / JSON / browser automation</text>

  <rect x="580" y="140" width="180" height="110" class="box"/>
  <text x="670" y="186" text-anchor="middle" class="label">Normalization</text>
  <text x="670" y="210" text-anchor="middle" class="small">Map to app schema</text>

  <rect x="830" y="140" width="220" height="110" class="box"/>
  <text x="940" y="186" text-anchor="middle" class="label">Postgres</text>
  <text x="940" y="210" text-anchor="middle" class="small">owners, teams, matchups, player stats</text>

  <path d="M260 195 H330" class="arrow"/>
  <path d="M510 195 H580" class="arrow"/>
  <path d="M760 195 H830" class="arrow"/>

  <rect x="320" y="330" width="260" height="150" class="stage"/>
  <text x="450" y="370" text-anchor="middle" class="label">Next.js App</text>
  <text x="450" y="400" text-anchor="middle" class="small">Queries + dashboards + season stories</text>
  <text x="450" y="426" text-anchor="middle" class="small">KPI cards, charts, leaderboard tables</text>
  <text x="450" y="452" text-anchor="middle" class="small">Historical + live-ready views</text>

  <rect x="620" y="330" width="260" height="150" class="stage"/>
  <text x="750" y="370" text-anchor="middle" class="label">GitHub</text>
  <text x="750" y="400" text-anchor="middle" class="small">Version control</text>
  <text x="750" y="426" text-anchor="middle" class="small">Source of truth for code</text>
  <text x="750" y="452" text-anchor="middle" class="small">Deployment trigger</text>

  <rect x="520" y="540" width="280" height="120" class="stage"/>
  <text x="660" y="580" text-anchor="middle" class="label">Vercel</text>
  <text x="660" y="606" text-anchor="middle" class="small">Production deployment</text>
  <text x="660" y="632" text-anchor="middle" class="small">Public-facing league platform</text>

  <path d="M940 250 V395 H580" class="arrow"/>
  <path d="M450 480 V540" class="arrow"/>
  <path d="M750 480 V540" class="arrow"/>

  <rect x="80" y="280" width="170" height="80" class="pill"/>
  <text x="165" y="325" text-anchor="middle" class="small">Historical pipeline</text>

  <rect x="80" y="430" width="170" height="80" class="pill"/>
  <text x="165" y="475" text-anchor="middle" class="small">Live-season fallback</text>

  <path d="M250 320 L320 360" class="arrow"/>
  <path d="M250 470 L320 430" class="arrow"/>
</svg>
